steps:
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "functions",
        "deploy",
        "gen2_http_crm_data",
        "--gen2",
        "--allow-unauthenticated",
        "--entry-point=run",
        "--region=europe-west1",
        "--trigger-http",
        "--runtime=python312",
        "--timeout=600",
        "--memory=2Gi",
        "--cpu=1",
        "--concurrency=3",
        "--min-instances=0",
        "--max-instances=3",
        "--source=.",
      ]
    dir: "eyerim/gen2_http_crm_data"
options:
  logging: CLOUD_LOGGING_ONLY
